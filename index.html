<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sectional</title>
  <meta name="theme-color" content="#5b2a86">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sectional">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="btn back" hidden aria-label="Back">‹ Back</button>
    <h1 id="title">Sectional</h1>
  </header>

  <main id="main"><p class="muted center">Loading…</p></main>

  <div id="mini" class="mini" hidden>
    <div class="mini-progress-wrap"><div class="mini-progress"></div></div>
    <div class="mini-inner">
      <button class="btn icon mini-back" aria-label="Back 5 seconds">⏪</button>
      <button class="btn icon primary mini-toggle" aria-label="Play">▶</button>
      <button class="btn icon mini-again" aria-label="Play again from the same place">↺</button>
      <button class="btn icon mini-stop" aria-label="Stop">⏹</button>
      <div class="mini-text">
        <div class="mini-name"></div>
        <div class="mini-time muted"></div>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a href="#/" data-tab="rehearsal"><span>🎤</span>Rehearsal</a>
    <a href="#/songs" data-tab="songs"><span>🎼</span>Songs</a>
    <a href="#/history" data-tab="history"><span>🗂</span>Past</a>
    <a href="#/more" data-tab="more"><span>❔</span>Help</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
