<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sectional Practice</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Practice">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="css/phone.css">
</head>
<body class="phone">
  <header class="topbar">
    <a href="#/" aria-label="Hummingsong Choirs – songs"><img class="brand-logo" src="../icons/hummingsong-logo.png" alt="Hummingsong Choirs"></a>
    <button id="back" class="btn back" hidden aria-label="Back">‹ Back</button>
    <h1 id="title">Sectional Practice</h1>
  </header>

  <div id="update" class="update" hidden>
    <span>✨ A new version is ready.</span>
    <button id="update-btn" class="btn">Tap to update</button>
  </div>

  <main id="main"><p class="muted center">Loading…</p></main>

  <div id="mini" class="mini" hidden>
    <div class="mini-progress-wrap"><div class="mini-progress"></div></div>
    <div class="mini-inner">
      <button class="btn icon primary mini-toggle" aria-label="Play">▶</button>
      <button class="btn icon mini-stop" aria-label="Stop">⏹</button>
      <a class="mini-text mini-link">
        <div class="mini-name"></div>
        <div class="mini-time muted"></div>
      </a>
    </div>
  </div>

  <nav class="tabbar">
    <a href="#/" data-tab="songs"><span>🎵</span>Songs</a>
    <a href="#/help" data-tab="help"><span>❔</span>Help</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
